# 青鸟 Bluebird 公开仓库发布流程
#
#   触发：`v*` tag push。
#   - 跑测试（语法检查 + unittest）
#   - 构建并推送镜像到 ghcr.io/hancic128/bluebird:<tag> 与 :latest
#   - 生成 GitHub Release（自动 release notes）
#
# 部署到具体环境（自有服务器 / 托管平台）由用户在各自的私有 / 内部仓库里实现；
# 公共仓库不承担「分发到 ACR」「SSH 部署到主机」之类的私有 CI 链路，避免 fork
# 进来的贡献者因缺失 secret 而构建失败。

name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 与 Dockerfile 的 python:3.11-alpine 对齐
          python-version: "3.11"
      - name: 语法检查
        run: python3 -m py_compile server.py
      - name: 单元测试
        run: python3 -m unittest discover -s tests -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/hancic128/bluebird:${{ github.ref_name }}
            ghcr.io/hancic128/bluebird:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true